<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>支持我的创作</title>
  <!-- 内联 favicon：避免浏览器自动请求不存在的 /favicon.ico 产生多余的 404 请求 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%98%95</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 只请求页面实际用到的字重（Baloo 2 只用了 700；Nunito 用了 400/600/700/800；
       Noto Sans SC 去掉了未使用的 300/500），减少字体文件体积，不影响任何视觉效果 -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #39C5BB;
      --accent-dark: #1FA69C;
      --accent-tint: #E6FAF8;
      --ink:      #14201f;
      --muted:    #8a9694;
      --border:   #e7edec;
      --bg:       #fff;
      --hover-bg: #F7FCFB;
      --shadow:   0 10px 30px -12px rgba(20,32,31,.12);
      --ease:     cubic-bezier(.22,.9,.32,1);
    }

    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a, button { -webkit-tap-highlight-color: transparent; }

    /* ── Layout shell ── */
    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: clamp(40px, 8vw, 76px) 24px 64px;
    }

    .layout {
      display: block;
    }

    .col-side { margin-top: 48px; }

    @media (min-width: 880px) {
      .layout {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 64px;
        align-items: start;
      }
      .col-side {
        margin-top: 0;
        position: sticky;
        top: 40px;
      }
    }

    /* ── Stagger fade-in (driven by --i custom property per element) ── */
    .col-main > *, .col-side > * {
      opacity: 0;
      transform: translateY(14px);
      animation: up .55s var(--ease) forwards;
      animation-delay: calc(var(--i, 0) * 0.055s);
    }

    @keyframes up {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .col-main > *, .col-side > * { animation: none; opacity: 1; transform: none; }
      html { scroll-behavior: auto; }
    }

    /* ── Header ── */
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent-dark);
      margin-bottom: 40px;
    }

    .desc {
      font-size: clamp(17px, 2.6vw, 20px);
      line-height: 1.75;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 28px;
    }

    .desc strong { color: var(--ink); font-weight: 700; }

    /* ── Fund usage list ── */
    .usage-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 40px;
    }

    .usage-list li {
      position: relative;
      padding: 12px 16px 12px 40px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink);
      background: #fff;
      transition: border-color .2s var(--ease), background .2s var(--ease);
    }

    .usage-list li::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-tint);
    }

    .usage-list li:hover {
      border-color: transparent;
      background: var(--hover-bg);
    }

    /* ── Mascot images ── */
    .mascot-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
      margin-bottom: 0;
    }

    .mascot {
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      background: var(--hover-bg);
      aspect-ratio: 1 / 1;
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    }

    .mascot:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: transparent;
    }

    .mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform .4s var(--ease);
    }

    .mascot:hover img { transform: scale(1.05); }

    @media (max-width: 380px) {
      .mascot-row { gap: 8px; }
    }

    /* ── Rule ── */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 30px;
    }

    /* ── Section label ── */
    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── QR row ── */
    .qr-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 44px;
    }

    .qr-box {
      flex: 1 1 140px;
      min-width: 140px;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    }

    .qr-box:hover {
      transform: translateY(-3px);
      border-color: transparent;
      box-shadow: var(--shadow);
    }

    @media (max-width: 440px) {
      .qr-box { flex-basis: 100%; }
    }

    .qr-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .qr-brand.wx  { color: #07C160; }
    .qr-brand.ali { color: #1677FF; }
    .qr-brand svg { width: 15px; height: 15px; }

    .qr-img {
      width: 100%;
      max-width: 152px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 12px;
      border-radius: 12px;
      background: var(--hover-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qr-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .placeholder-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #bbb;
      font-size: 10px;
      letter-spacing: .04em;
      line-height: 1.5;
      text-align: center;
    }
    .placeholder-icon svg { width: 32px; height: 32px; opacity: .5; }
    .placeholder-icon code {
      font-family: monospace;
      font-size: 10px;
      color: #aaa;
      background: #ececec;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .qr-tip {
      font-size: 11px;
      color: var(--muted);
    }

    .qr-reminder {
      margin-top: 10px;
      padding: 9px 11px;
      background: var(--accent-tint);
      border: 1px solid var(--accent);
      border-radius: 10px;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--accent-dark);
      text-align: left;
    }
    .qr-reminder strong { font-weight: 800; }

    /* ── Link list ── */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 36px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--ink);
      transition: background .2s var(--ease), transform .2s var(--ease);
    }

    .link-item:hover { background: var(--hover-bg); transform: translateX(2px); }

    .link-dot {
      width: 36px; height: 36px;
      border-radius: 12px;
      background: var(--accent-tint);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .link-info { flex: 1; min-width: 0; }
    .link-name { font-size: 14px; font-weight: 700; line-height: 1; margin-bottom: 3px; }
    .link-href { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .link-chevron { color: #ccc; font-size: 18px; flex-shrink: 0; transition: color .2s, transform .2s; }
    .link-item:hover .link-chevron { color: var(--accent); transform: translateX(2px); }

    /* ── Total raised stat ── */
    .stat-card {
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 24px;
      margin-bottom: 20px;
      background: linear-gradient(160deg, var(--accent-tint), #fff 65%);
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-dark);
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'Baloo 2', 'Noto Sans SC', sans-serif;
      font-size: clamp(30px, 5vw, 38px);
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .stat-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Leaderboard ── */
    .board {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .board-state {
      font-size: 13px;
      color: var(--muted);
      padding: 18px 12px;
      text-align: center;
    }

    .board-row {
      padding: 14px 12px;
      border-radius: 14px;
      transition: background .2s var(--ease);
    }

    .board-row:hover { background: var(--hover-bg); }

    .board-inner {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .board-rank {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #f1f4f3;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .board-rank.r1 {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 0 4px var(--accent-tint);
      animation: glow 2.6s ease-in-out infinite;
    }
    .board-rank.r2 { background: #eef0f0; color: #667; }
    .board-rank.r3 { background: #FCF1E1; color: #B5793A; }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 4px var(--accent-tint); }
      50%      { box-shadow: 0 0 0 7px var(--accent-tint); }
    }
    @media (prefers-reduced-motion: reduce) {
      .board-rank.r1 { animation: none; }
    }

    .board-main { flex: 1; min-width: 0; }

    .board-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .board-name .anon-icon {
      color: var(--muted);
      font-size: 12px;
    }

    .board-sub {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--muted);
    }

    .board-amount {
      font-weight: 700;
      color: var(--accent-dark);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .board-channel-tag {
      background: var(--hover-bg);
      color: var(--muted);
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
    }

    .board-note {
      font-size: 12px;
      color: #b7bfbd;
      margin-top: 4px;
    }

    .board-more-toggle {
      border: none;
      background: none;
      padding: 4px 0;
      font-size: 12px;
      color: var(--accent-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: inherit;
      font-weight: 600;
    }

    .board-more-toggle .chev {
      display: inline-block;
      font-size: 12px;
      transition: transform .2s ease;
    }
    .board-more-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

    .board-records {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .board-record {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .board-record .rec-amount {
      color: var(--ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .board-record .rec-note {
      flex-basis: 100%;
      color: #bbb;
      font-size: 11px;
    }

    /* ── Footer (thank-you note) ── */
    footer {
      font-size: 14px;
      color: #bbb;
      line-height: 1.7;
    }

    footer strong {
      color: var(--ink);
      font-weight: 700;
    }

    .heart { color: var(--accent); display: inline-block; animation: beat 1.4s ease infinite; }
    @keyframes beat {
      0%,100% { transform: scale(1) }
      30%      { transform: scale(1.25) }
      60%      { transform: scale(1) }
      80%      { transform: scale(1.15) }
    }
    @media (prefers-reduced-motion: reduce) {
      .heart { animation: none; }
    }

    /* ── Site footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      margin-top: 56px;
      padding-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .site-footer-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .site-footer-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: #99a3a1;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color .2s, background .2s;
    }

    .site-footer-link:hover {
      color: var(--ink);
      background: var(--hover-bg);
    }

    .site-footer-link svg { width: 13px; height: 13px; flex-shrink: 0; }

    .site-footer-sep {
      font-size: 12px;
      color: #ddd;
    }

    .powered {
      font-size: 11px;
      color: #ccc;
      letter-spacing: .02em;
    }

    .powered a {
      color: #aaa;
      text-decoration: none;
      font-weight: 600;
      transition: color .2s;
    }

    .powered a:hover { color: var(--accent-dark); }

    /* ── Small-screen refinements ── */
    @media (max-width: 380px) {
      .page { padding-left: 18px; padding-right: 18px; }
      .desc { margin-bottom: 22px; }
      hr { margin-bottom: 26px; }
      .qr-row, .link-list, .usage-list { margin-bottom: 32px; }
      .qr-img { max-width: 128px; }
      .stat-card { padding: 20px 18px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="layout">

    <div class="col-main">

      <p class="eyebrow" id="eyebrow-text" style="--i:0">Support my work</p>

      <p class="desc" id="intro-text" style="--i:1"></p>

      <hr style="--i:2">
      <p class="label" style="--i:3">扫码赞赏</p>

      <div class="qr-row" id="qr-row" style="--i:4"></div>

      <div id="links-section">
        <hr style="--i:5">
        <p class="label" style="--i:6">更多渠道</p>
        <div class="link-list" id="link-list" style="--i:7"></div>
      </div>

      <div id="usage-section">
        <hr style="--i:8">
        <p class="label" style="--i:9">捐款用途</p>
        <ul class="usage-list" id="usage-list" style="--i:10"></ul>
      </div>

      <footer id="footer-signature" style="--i:11"></footer>

      <div class="mascot-row" id="mascot-row" style="--i:12"></div>

    </div>

    <div class="col-side">

      <p class="label" style="--i:0">捐赠排行榜</p>

      <div class="stat-card" style="--i:1">
        <div class="stat-label">累计已收到支持</div>
        <div class="stat-value" id="stat-total">¥0.00</div>
        <div class="stat-sub" id="stat-sub">加载中…</div>
      </div>

      <div class="board" id="board" style="--i:2">
        <div class="board-state">加载中…</div>
      </div>

    </div>

  </div>

  <!-- ── Site footer ── -->
  <div class="site-footer">
    <div class="site-footer-links" id="site-footer-links"></div>

    <p class="powered">
      Powered by <a href="https://claude.ai" target="_blank" rel="noopener">Claude</a>
    </p>
  </div>

</div>

<script src="config.js"></script>
<script>
  const CFG = window.SITE_CONFIG || {};

  /* ── 主题色（可选，config.js 里不填就用默认薄荷绿）── */
  if (CFG.themeColor) {
    const rootStyle = document.documentElement.style;
    if (CFG.themeColor.accent) rootStyle.setProperty('--accent', CFG.themeColor.accent);
    if (CFG.themeColor.accentDark) rootStyle.setProperty('--accent-dark', CFG.themeColor.accentDark);
    if (CFG.themeColor.accentTint) rootStyle.setProperty('--accent-tint', CFG.themeColor.accentTint);
  }

  /* ── 页面标题 / 顶部小标签 / 简介 ── */
  if (CFG.pageTitle) document.title = CFG.pageTitle;
  const eyebrowEl = document.getElementById('eyebrow-text');
  if (eyebrowEl) eyebrowEl.textContent = CFG.eyebrow || 'Support my work';
  const introEl = document.getElementById('intro-text');
  if (introEl) introEl.innerHTML = CFG.introHtml || '';

  /* ── 收款二维码加载 ──
     依次尝试下面这些后缀，用第一个能成功加载的图片（因此 webp / png / jpg 都可以直接使用，
     放哪种格式的文件都不用改代码）。
  */
  const QR_EXT_CANDIDATES = ['webp', 'png', 'jpg', 'jpeg'];

  function tryLoadQr(basePath, frameId, onAllFail) {
    let i = 0;
    function attempt() {
      if (i >= QR_EXT_CANDIDATES.length) { if (onAllFail) onAllFail(); return; }
      const ext = QR_EXT_CANDIDATES[i++];
      const img = new Image();
      img.onload = () => {
        const f = document.getElementById(frameId);
        if (!f) return;
        f.innerHTML = '';
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:center';
        f.appendChild(img);
      };
      img.onerror = attempt;
      img.src = `${basePath}.${ext}`;
    }
    attempt();
  }

  const BRAND_ICONS = {
    wx: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-3.895-6.348-7.596-6.348zm-2.906 3.8c.642 0 1.162.53 1.162 1.18a1.17 1.17 0 0 1-1.162 1.18A1.17 1.17 0 0 1 4.623 7.17c0-.65.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.53 1.162 1.18a1.17 1.17 0 0 1-1.162 1.18 1.17 1.17 0 0 1-1.162-1.18c0-.65.52-1.18 1.162-1.18zm2.34 4.879c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.49.49 0 0 1 .178-.554C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zm-3.934 2.555c.529 0 .958.436.958.972a.966.966 0 0 1-.958.973.966.966 0 0 1-.958-.973c0-.536.43-.972.958-.972zm4.947 0c.529 0 .958.436.958.972a.966.966 0 0 1-.958.973.966.966 0 0 1-.958-.973c0-.536.43-.972.958-.972z"/></svg>',
    ali: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.422 15.358c-3.83-1.153-6.055-1.84-7.766-2.358.802-1.422 1.328-3.042 1.526-4.817H18V6.817h-4.002V5h-2.443v1.817H7.578V8.183h6.607c-.175 1.367-.56 2.61-1.11 3.658-1.4-.38-2.96-.722-4.612-.837C5.196 10.745 2 12.44 2 15.65 2 18.055 4.02 20 6.52 20c2.73 0 5.428-1.77 7.306-4.728 2.155.837 4.552 1.86 6.884 3.03L22 17.24a35.028 35.028 0 0 0-.578-.882zM6.52 18.124C4.98 18.124 4 17.074 4 15.65c0-1.768 1.593-2.9 3.558-2.69 1.418.155 2.75.526 3.988.96C9.98 16.8 8.22 18.124 6.52 18.124z"/></svg>',
  };

  const qrPlaceholderSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>';

  /* ── 收款二维码渲染：全部读取 config.js 里的 qrChannels，增删改一个二维码只改配置文件即可 ── */
  function renderQrChannels() {
    const row = document.getElementById('qr-row');
    if (!row) return;
    const channels = Array.isArray(CFG.qrChannels) ? CFG.qrChannels : [];
    channels.forEach((ch, idx) => {
      if (!ch || !ch.id || !ch.name) return;
      const frameId = `qr-frame-${idx}`;
      const box = document.createElement('div');
      box.className = 'qr-box';
      const brandIcon = ch.brand && BRAND_ICONS[ch.brand] ? BRAND_ICONS[ch.brand] : qrPlaceholderSvg;
      const brandClass = ch.brand === 'wx' ? ' wx' : ch.brand === 'ali' ? ' ali' : '';
      const nameStyle = ch.color ? ` style="color:${escapeHtml(ch.color)}"` : '';
      box.innerHTML = `
        <div class="qr-brand${brandClass}"${nameStyle}>
          ${brandIcon}
          ${escapeHtml(ch.name)}
        </div>
        <div class="qr-img" id="${frameId}">
          <div class="placeholder-icon">
            ${qrPlaceholderSvg}
            <code>${escapeHtml(ch.id)}.*</code>
          </div>
        </div>
        <p class="qr-tip">${escapeHtml(ch.tip || '扫码支持')}</p>
        ${ch.reminderHtml ? `<div class="qr-reminder">${ch.reminderHtml}</div>` : ''}
      `;
      row.appendChild(box);
      tryLoadQr(ch.id, frameId, () => box.remove());
    });
  }
  renderQrChannels();

  /* ── 「更多渠道」链接列表：留空数组则整块隐藏 ── */
  function renderLinks() {
    const section = document.getElementById('links-section');
    const list = document.getElementById('link-list');
    if (!section || !list) return;
    const links = Array.isArray(CFG.links) ? CFG.links : [];
    if (links.length === 0) { section.remove(); return; }
    list.innerHTML = links.map((l) => `
      <a class="link-item" href="${escapeHtml(l.href || '#')}" target="_blank" rel="noopener">
        <div class="link-dot">${l.icon ? escapeHtml(l.icon) : '🔗'}</div>
        <div class="link-info">
          <div class="link-name">${escapeHtml(l.name || '')}</div>
          <div class="link-href">${escapeHtml(l.hrefLabel || '')}</div>
        </div>
        <span class="link-chevron">›</span>
      </a>
    `).join('');
  }
  renderLinks();

  /* ── 「捐款用途」列表：留空数组则整块隐藏 ── */
  function renderUsageList() {
    const section = document.getElementById('usage-section');
    const list = document.getElementById('usage-list');
    if (!section || !list) return;
    const items = Array.isArray(CFG.usageList) ? CFG.usageList : [];
    if (items.length === 0) { section.remove(); return; }
    list.innerHTML = items.map((t) => `<li>${escapeHtml(t)}</li>`).join('');
  }
  renderUsageList();

  /* ── 页脚署名 ── */
  function renderFooterSignature() {
    const el = document.getElementById('footer-signature');
    if (!el) return;
    el.innerHTML = `感谢每一份支持 <span class="heart">♥</span><br>— <strong>${escapeHtml(CFG.footerName || '')}</strong>`;
  }
  renderFooterSignature();

  /* ── 顶部装饰图（吉祥物）：留空数组则整块隐藏；优先 .webp，找不到自动回退 .jpg ── */
  function renderMascots() {
    const row = document.getElementById('mascot-row');
    if (!row) return;
    const items = Array.isArray(CFG.mascots) ? CFG.mascots : [];
    if (items.length === 0) { row.remove(); return; }
    row.innerHTML = items.map((m) => {
      const id = escapeHtml(m.id);
      const alt = escapeHtml(m.alt || '');
      return `
        <div class="mascot">
          <img src="assets/img/${id}.webp" alt="${alt}" loading="lazy"
               onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='assets/img/${id}.jpg';}else{this.closest('.mascot').style.display='none';}" />
        </div>
      `;
    }).join('');
  }
  renderMascots();

  /* ── 页脚「个人主页 / GitHub / 管理」链接：主页和 GitHub 由 config.js 控制，不填就不显示 ── */
  function renderFooterLinks() {
    const el = document.getElementById('site-footer-links');
    if (!el) return;
    const fl = CFG.footerLinks || {};
    const parts = [];
    if (fl.homepage && fl.homepage.href) {
      parts.push(`
        <a class="site-footer-link" href="${escapeHtml(fl.homepage.href)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          ${escapeHtml(fl.homepage.name || '主页')}
        </a>
      `);
    }
    if (fl.github && fl.github.href) {
      parts.push(`
        <a class="site-footer-link" href="${escapeHtml(fl.github.href)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </a>
      `);
    }
    parts.push(`
      <a class="site-footer-link" href="/admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        管理
      </a>
    `);
    el.innerHTML = parts.map((p, i) => i === 0 ? p : `<span class="site-footer-sep">·</span>${p}`).join('');
  }
  renderFooterLinks();

  /* ── Donation leaderboard ── */
  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatAmount(n) {
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  function animateTotal(target) {
    const el = document.getElementById('stat-total');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || target === 0) {
      el.textContent = formatAmount(target);
      return;
    }
    const duration = 900;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = formatAmount(target * eased);
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderBoard(payload) {
    const board = document.getElementById('board');
    const list = payload && Array.isArray(payload.leaderboard) ? payload.leaderboard : [];

    animateTotal(payload && typeof payload.total === 'number' ? payload.total : 0);
    document.getElementById('stat-sub').textContent =
      list.length > 0 ? `共 ${list.length} 位支持者` : '还没有支持者';

    if (list.length === 0) {
      board.innerHTML = '<div class="board-state">还没有捐赠记录，成为第一位支持者吧 ✨</div>';
      return;
    }

    board.innerHTML = list.map((entry, idx) => {
      const rank = idx + 1;
      const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
      const hasMore = entry.count > 1;
      const singleNote = !hasMore && entry.records[0] && entry.records[0].note;

      const subHtml = hasMore
        ? `<span class="board-amount">${formatAmount(entry.total)}</span>
           <button class="board-more-toggle" data-idx="${idx}" aria-expanded="false">
             含更多捐赠 · 共 ${entry.count} 笔<span class="chev">›</span>
           </button>`
        : `<span class="board-amount">${formatAmount(entry.total)}</span>
           <span class="board-channel-tag">${escapeHtml(entry.latest_channel)}</span>`;

      const recordsHtml = entry.records.map((r) => `
        <div class="board-record">
          <span>${escapeHtml(r.channel)} · ${formatDate(r.created_at)}</span>
          <span class="rec-amount">${formatAmount(r.amount)}</span>
          ${r.note ? `<span class="rec-note">${escapeHtml(r.note)}</span>` : ''}
        </div>
      `).join('');

      return `
        <div class="board-row">
          <div class="board-inner">
            <div class="board-rank ${rankClass}">${rank}</div>
            <div class="board-main">
              <div class="board-name">
                ${entry.anonymous ? '<span class="anon-icon">🕶</span>' : ''}
                ${escapeHtml(entry.donor_name)}
              </div>
              <div class="board-sub">${subHtml}</div>
              ${singleNote ? `<div class="board-note">${escapeHtml(singleNote)}</div>` : ''}
              ${hasMore ? `<div class="board-records" id="records-${idx}" hidden>${recordsHtml}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    board.querySelectorAll('.board-more-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const panel = document.getElementById(`records-${btn.dataset.idx}`);
        const willOpen = panel.hidden;
        panel.hidden = !willOpen;
        btn.setAttribute('aria-expanded', String(willOpen));
      });
    });
  }

  async function loadLeaderboard() {
    const board = document.getElementById('board');
    try {
      const res = await fetch('/api/leaderboard');
      if (!res.ok) throw new Error('request failed');
      renderBoard(await res.json());
    } catch (e) {
      board.innerHTML = '<div class="board-state">排行榜加载失败，请刷新重试</div>';
      document.getElementById('stat-sub').textContent = '加载失败';
    }
  }

  loadLeaderboard();
</script>
