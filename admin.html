<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>捐赠管理后台</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:      #39C5BB;
      --accent-dark: #1FA69C;
      --accent-tint: #E6FAF8;
      --ink:      #14201f;
      --muted:    #8a9694;
      --border:   #e7edec;
      --bg:       #fff;
      --hover-bg: #F7FCFB;
      --danger:   #e0574a;
      --danger-tint: #FDF0EE;
      --ok:       #1FA69C;
      --ease:     cubic-bezier(.22,.9,.32,1);
    }

    body {
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a, button { -webkit-tap-highlight-color: transparent; }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(40px, 9vw, 64px) 24px 80px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent-dark);
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Baloo 2', 'Noto Sans SC', sans-serif;
      font-weight: 700;
      font-size: clamp(30px, 7vw, 40px);
      line-height: 1.15;
      letter-spacing: -.01em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 36px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      display: block;
    }

    /* ── Login screen ── */
    .login-box { max-width: 360px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    select {
      font-family: inherit;
      font-size: 14px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      width: 100%;
      transition: border-color .2s;
    }

    select { cursor: pointer; }

    input:focus, select:focus, button:focus-visible {
      outline: none;
      border-color: var(--accent);
    }
    button:focus-visible { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }

    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 12px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      transition: opacity .2s, transform .2s var(--ease);
    }
    .btn:hover { opacity: .88; transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
    }

    .btn-outline {
      background: none;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
      background: none;
    }
    .btn-danger:hover { background: var(--danger-tint); }

    .btn-small {
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 9px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .msg {
      font-size: 13px;
      padding: 10px 13px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .msg.error { background: var(--danger-tint); color: var(--danger); }
    .msg.ok    { background: var(--accent-tint); color: var(--accent-dark); }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    /* ── Form ── */
    .form-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 36px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-grid .span-2 { grid-column: 1 / -1; }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .channel-row { display: flex; gap: 8px; align-items: stretch; }
    .channel-row select { flex: 1; }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    /* ── Channel manager ── */
    .channel-manager {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 36px;
    }

    .channel-manager-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .channel-manager-header .label { margin-bottom: 0; }

    .channel-manager-toggle {
      font-size: 12px;
      color: var(--accent-dark);
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .channel-manager-toggle .chev {
      display: inline-block;
      transition: transform .2s ease;
    }
    .channel-manager-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

    .channel-manager-body { margin-top: 16px; }

    .channel-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .channel-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--hover-bg);
      border: 1px solid var(--border);
      padding: 6px 8px 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .channel-chip button {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: #e2e8e7;
      color: #667;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .channel-chip button:hover { background: var(--danger); color: #fff; }

    .channel-add-row { display: flex; gap: 8px; }
    .channel-add-row input { flex: 1; }

    /* ── Records list ── */
    .records { display: flex; flex-direction: column; gap: 8px; }

    .record-row {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      transition: border-color .2s;
    }
    .record-row:hover { border-color: #d8e3e1; }

    .record-main { flex: 1; min-width: 180px; }
    .record-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .anon-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--accent-tint);
      color: var(--accent-dark);
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: .02em;
    }
    .record-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
    .record-meta .amt { color: var(--accent-dark); font-weight: 700; }
    .record-note { font-size: 12px; color: #b7bfbd; margin-top: 4px; }

    .record-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .empty-state {
      font-size: 13px;
      color: var(--muted);
      padding: 24px 0;
      text-align: center;
    }

    .search-row { margin-bottom: 18px; }

    .hint {
      font-size: 12px;
      color: #a9b3b1;
      margin-top: 6px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="page">

  <!-- ── Login screen ── -->
  <section id="login-view" hidden>
    <p class="eyebrow">Admin</p>
    <h1>管理登录</h1>
    <p class="subtitle">输入管理员密码以管理捐赠排行榜数据</p>

    <div id="login-msg"></div>

    <form id="login-form" class="login-box">
      <div class="field">
        <label for="login-password">管理员密码</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">登录</button>
    </form>
  </section>

  <!-- ── Dashboard ── -->
  <section id="dashboard-view" hidden>
    <div class="topbar">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>捐赠管理</h1>
      </div>
      <button class="btn btn-outline btn-small" id="logout-btn">退出登录</button>
    </div>
    <p class="subtitle">添加、追加或修改捐赠记录，排行榜会自动按总金额排序。</p>

    <div id="dash-msg"></div>

    <div class="form-card">
      <span class="label" id="form-title">添加捐赠记录</span>
      <form id="donation-form">
        <input type="hidden" id="record-id" value="" />
        <div class="form-grid">
          <div class="field">
            <label for="donor-name">捐赠者名称（留空则匿名）</label>
            <input type="text" id="donor-name" placeholder="例如：张三，留空则匿名" />
          </div>
          <div class="field">
            <label for="channel">捐赠渠道</label>
            <div class="channel-row">
              <select id="channel" required></select>
              <button type="button" class="btn btn-outline btn-icon" id="quick-add-channel" title="添加新渠道">＋</button>
            </div>
          </div>
          <div class="field">
            <label for="amount">金额（元）</label>
            <input type="number" id="amount" min="0.01" step="0.01" required placeholder="0.00" />
          </div>
          <div class="field">
            <label for="created-at">日期（可选）</label>
            <input type="date" id="created-at" />
          </div>
          <div class="field span-2">
            <label for="note">备注（可选）</label>
            <input type="text" id="note" placeholder="留言 / 备注" />
          </div>
        </div>
        <p class="hint">同一「捐赠者名称」多次添加会自动合并到排行榜同一人名下，显示总金额并可展开明细——用于追加捐赠。名称留空将自动按匿名录入（排行榜显示「匿名」，且不与任何记录合并）。</p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="form-submit">添加记录</button>
          <button type="button" class="btn btn-outline" id="form-cancel" hidden>取消编辑</button>
        </div>
      </form>
    </div>

    <div class="channel-manager">
      <div class="channel-manager-header" id="channel-manager-header">
        <span class="label">管理捐赠渠道</span>
        <button type="button" class="channel-manager-toggle" id="channel-manager-toggle" aria-expanded="false">
          展开<span class="chev">›</span>
        </button>
      </div>
      <div class="channel-manager-body" id="channel-manager-body" hidden>
        <div class="channel-chips" id="channel-chips"></div>
        <div class="channel-add-row">
          <input type="text" id="new-channel-name" placeholder="新渠道名称，例如：Ko-fi" maxlength="40" />
          <button type="button" class="btn btn-outline btn-small" id="add-channel-btn">添加渠道</button>
        </div>
      </div>
    </div>

    <hr>

    <span class="label">全部记录</span>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="按捐赠者名称搜索…" />
    </div>
    <div class="records" id="records-list">
      <div class="empty-state">加载中…</div>
    </div>
  </section>

</div>

<script>
  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const loginMsg = document.getElementById('login-msg');
  const dashMsg = document.getElementById('dash-msg');
  const logoutBtn = document.getElementById('logout-btn');

  const donationForm = document.getElementById('donation-form');
  const recordIdInput = document.getElementById('record-id');
  const donorNameInput = document.getElementById('donor-name');
  const channelSelect = document.getElementById('channel');
  const quickAddChannelBtn = document.getElementById('quick-add-channel');
  const amountInput = document.getElementById('amount');
  const createdAtInput = document.getElementById('created-at');
  const noteInput = document.getElementById('note');
  const formTitle = document.getElementById('form-title');
  const formSubmit = document.getElementById('form-submit');
  const formCancel = document.getElementById('form-cancel');
  const recordsList = document.getElementById('records-list');
  const searchInput = document.getElementById('search-input');

  const channelManagerHeader = document.getElementById('channel-manager-header');
  const channelManagerToggle = document.getElementById('channel-manager-toggle');
  const channelManagerBody = document.getElementById('channel-manager-body');
  const channelChips = document.getElementById('channel-chips');
  const newChannelNameInput = document.getElementById('new-channel-name');
  const addChannelBtn = document.getElementById('add-channel-btn');

  let allRecords = [];
  let allChannels = [];

  function showMsg(el, text, type) {
    el.innerHTML = text ? `<div class="msg ${type}">${escapeHtml(text)}</div>` : '';
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function formatAmount(n) {
    return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  async function checkAuth() {
    try {
      const res = await fetch('/api/auth/status');
      const data = await res.json();
      if (data.loggedIn) {
        loginView.hidden = true;
        dashboardView.hidden = false;
        loadChannels();
        loadRecords();
      } else {
        loginView.hidden = false;
        dashboardView.hidden = true;
      }
    } catch {
      loginView.hidden = false;
      dashboardView.hidden = true;
      showMsg(loginMsg, '无法连接服务器，请检查网络后重试', 'error');
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('login-submit');
    submitBtn.disabled = true;
    showMsg(loginMsg, '', '');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('login-password').value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '登录失败');
      document.getElementById('login-password').value = '';
      checkAuth();
    } catch (err) {
      showMsg(loginMsg, err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    checkAuth();
  });

  /* ── Channel management ── */
  function renderChannelSelect(selected) {
    channelSelect.innerHTML = allChannels.map((c) =>
      `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`
    ).join('');
    if (selected && allChannels.some((c) => c.name === selected)) {
      channelSelect.value = selected;
    }
  }

  function renderChannelChips() {
    if (allChannels.length === 0) {
      channelChips.innerHTML = '<span class="hint">还没有任何渠道</span>';
      return;
    }
    channelChips.innerHTML = allChannels.map((c) => `
      <span class="channel-chip">
        ${escapeHtml(c.name)}
        <button type="button" data-id="${c.id}" title="删除渠道">×</button>
      </span>
    `).join('');
    channelChips.querySelectorAll('button').forEach((btn) => {
      btn.addEventListener('click', () => deleteChannel(btn.dataset.id));
    });
  }

  async function loadChannels() {
    try {
      const res = await fetch('/api/admin/channels');
      if (res.status === 401) { checkAuth(); return; }
      if (!res.ok) throw new Error('加载渠道失败');
      allChannels = await res.json();
      const current = channelSelect.value;
      renderChannelSelect(current);
      renderChannelChips();
    } catch (err) {
      channelChips.innerHTML = `<span class="hint">加载失败：${escapeHtml(err.message)}</span>`;
    }
  }

  async function addChannel(name) {
    const res = await fetch('/api/admin/channels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '添加渠道失败');
    await loadChannels();
    return data.name || name;
  }

  addChannelBtn.addEventListener('click', async () => {
    const name = newChannelNameInput.value.trim();
    if (!name) return;
    addChannelBtn.disabled = true;
    try {
      await addChannel(name);
      newChannelNameInput.value = '';
    } catch (err) {
      showMsg(dashMsg, err.message, 'error');
    } finally {
      addChannelBtn.disabled = false;
    }
  });

  newChannelNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addChannelBtn.click(); }
  });

  quickAddChannelBtn.addEventListener('click', async () => {
    const name = prompt('输入新的捐赠渠道名称：');
    if (!name || !name.trim()) return;
    try {
      const savedName = await addChannel(name.trim());
      channelSelect.value = savedName;
    } catch (err) {
      showMsg(dashMsg, err.message, 'error');
    }
  });

  async function deleteChannel(id) {
    if (!confirm('确定要删除这个渠道吗？已有的捐赠记录不受影响。')) return;
    try {
      const res = await fetch(`/api/admin/channels/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '删除失败');
      await loadChannels();
    } catch (err) {
      showMsg(dashMsg, err.message, 'error');
    }
  }

  channelManagerHeader.addEventListener('click', () => {
    const willOpen = channelManagerBody.hidden;
    channelManagerBody.hidden = !willOpen;
    channelManagerToggle.setAttribute('aria-expanded', String(willOpen));
    channelManagerToggle.innerHTML = willOpen
      ? '收起<span class="chev">›</span>'
      : '展开<span class="chev">›</span>';
  });

  /* ── Donation form ── */
  function resetForm() {
    donationForm.reset();
    recordIdInput.value = '';
    renderChannelSelect();
    formTitle.textContent = '添加捐赠记录';
    formSubmit.textContent = '添加记录';
    formCancel.hidden = true;
  }

  formCancel.addEventListener('click', resetForm);

  donationForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    formSubmit.disabled = true;
    showMsg(dashMsg, '', '');

    const payload = {
      donor_name: donorNameInput.value.trim(),
      channel: channelSelect.value.trim(),
      amount: Number(amountInput.value),
      note: noteInput.value.trim(),
      created_at: createdAtInput.value ? new Date(createdAtInput.value).toISOString() : undefined
    };

    const id = recordIdInput.value;
    const url = id ? `/api/admin/donations/${id}` : '/api/admin/donations';
    const method = id ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '保存失败');
      showMsg(dashMsg, id ? '记录已更新' : '记录已添加', 'ok');
      resetForm();
      loadRecords();
    } catch (err) {
      if (err.message.includes('未登录')) { checkAuth(); return; }
      showMsg(dashMsg, err.message, 'error');
    } finally {
      formSubmit.disabled = false;
    }
  });

  function editRecord(record) {
    recordIdInput.value = record.id;
    donorNameInput.value = record.donor_name || '';
    renderChannelSelect(record.channel);
    amountInput.value = record.amount;
    noteInput.value = record.note || '';
    const d = new Date(record.created_at);
    createdAtInput.value = isNaN(d.getTime()) ? '' : d.toISOString().slice(0, 10);
    formTitle.textContent = '编辑捐赠记录';
    formSubmit.textContent = '保存修改';
    formCancel.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deleteRecord(id) {
    if (!confirm('确定要删除这条捐赠记录吗？此操作不可撤销。')) return;
    try {
      const res = await fetch(`/api/admin/donations/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '删除失败');
      showMsg(dashMsg, '记录已删除', 'ok');
      loadRecords();
    } catch (err) {
      if (err.message.includes('未登录')) { checkAuth(); return; }
      showMsg(dashMsg, err.message, 'error');
    }
  }

  function renderRecords() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q
      ? allRecords.filter((r) => String(r.donor_name || '').toLowerCase().includes(q))
      : allRecords;

    if (filtered.length === 0) {
      recordsList.innerHTML = `<div class="empty-state">${q ? '没有匹配的记录' : '还没有任何捐赠记录，先在上方添加一条吧'}</div>`;
      return;
    }

    recordsList.innerHTML = filtered.map((r) => `
      <div class="record-row" data-id="${r.id}">
        <div class="record-main">
          <div class="record-name">
            ${r.donor_name ? escapeHtml(r.donor_name) : '<span style="opacity:.55;font-weight:400">（匿名）</span>'}
            ${!r.donor_name ? '<span class="anon-badge">匿名</span>' : ''}
          </div>
          <div class="record-meta">
            <span class="amt">${formatAmount(r.amount)}</span>
            <span>${escapeHtml(r.channel)}</span>
            <span>${formatDate(r.created_at)}</span>
          </div>
          ${r.note ? `<div class="record-note">${escapeHtml(r.note)}</div>` : ''}
        </div>
        <div class="record-actions">
          <button class="btn btn-outline btn-small" data-action="edit" data-id="${r.id}">编辑</button>
          <button class="btn btn-danger btn-small" data-action="delete" data-id="${r.id}">删除</button>
        </div>
      </div>
    `).join('');

    recordsList.querySelectorAll('[data-action="edit"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const record = allRecords.find((r) => String(r.id) === btn.dataset.id);
        if (record) editRecord(record);
      });
    });
    recordsList.querySelectorAll('[data-action="delete"]').forEach((btn) => {
      btn.addEventListener('click', () => deleteRecord(btn.dataset.id));
    });
  }

  searchInput.addEventListener('input', renderRecords);

  async function loadRecords() {
    try {
      const res = await fetch('/api/admin/donations');
      if (res.status === 401) { checkAuth(); return; }
      if (!res.ok) throw new Error('加载失败');
      allRecords = await res.json();
      renderRecords();
    } catch (err) {
      recordsList.innerHTML = `<div class="empty-state">加载失败：${escapeHtml(err.message)}</div>`;
    }
  }

  checkAuth();
</script>
</body>
</html>
